name: CI

on:
  push:
  pull_request:

jobs:
  build-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Build
        run: make build

      - name: Lint
        run: make lint/ci

      - name: Test
        run: make test
