<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poker Game</title>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.1/sse.js"></script>
    <script src="https://cardmeister.github.io/elements.cardmeister.full.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .players { display: flex; flex-wrap: wrap; gap: 12px; }
        .player {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 10px; border: 2px solid #475569; border-radius: 8px; background: #f8fafc;
        }
        .player.to-act { border-color: #2563eb; box-shadow: 0 0 8px #2563eb; }
        .player.winner { border-color: #d4a017; background: #fffbea; box-shadow: 0 0 10px #f5c518; }
        .player-name { display: flex; align-items: center; gap: 4px; height: 20px; }
        .roles { font-weight: normal; }
        .player-cards { display: flex; }
        .player-cards playing-card { margin: 2px; }
        .player-cards playing-card img { height: 90px; }
        .player-action { margin-top: 2px; }
        .action {
            padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-weight: bold;
            background: #2c47b8; color: #fff;
        }
        .action.winner-badge { background: #d4a017; }
        playing-card { display: inline-block; margin: 4px; }
        playing-card img { height: 150px; width: auto; display: block; }
    </style>
</head>
<body>
    <div hx-ext="sse" sse-connect="/events">
        <div id="game-state" sse-swap="game-state">
            <p>Warte auf den Gamestate...</p>
        </div>
    </div>
</body>
</html>
